name: Actualizar Datos de Botica

on:
  schedule:
    - cron: '*/30 * * * *' # Cada 30 minutos
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar procesamiento de datos
        env:
          MASTER_EXCEL_URL: ${{ secrets.MASTER_EXCEL_URL }} # URL del Excel Maestro configurada en GitHub
        run: python main.py

      - name: Commitear y subir cambios
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add outputs/ registry.json changelog.md # Asegurar que todo se trackea
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de stock: $(date +'%Y-%m-%d %H:%M')" && git push)
